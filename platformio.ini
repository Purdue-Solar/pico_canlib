[platformio]
default_envs = rp2350

[env]
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = espidf
build_flags =
    -DCAN_TARGET_ESP32

[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = picosdk
build_flags =
    -DCAN_TARGET_RP2350
build_src_filter =
    -<*>
    +<examples/pico_example.cpp>

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DCAN_TARGET_TEENSY
build_src_filter =
    -<*>
    +<examples/teensy_example.cpp>
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git